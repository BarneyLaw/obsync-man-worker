# Validates the Go half of obsync: the worker, the inspection CLI, and the
# contract fixtures in schema/ that the plugin reads.
#
# Triggers on worker changes, and on any change to the worker<->plugin
# contract from EITHER side, because the two ship as a pair. The contract block
# below is identical in plugin.yml: when it matches, both workflows run and
# each half is checked against the same fixtures. Keep the two blocks in sync.
name: worker

on:
  push:
    branches: [main]
    paths:
      # worker
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'deploy/rules.json'
      - 'scripts/garage-dev.sh'
      - '.github/workflows/worker.yml'
      # contract (identical in plugin.yml)
      - 'schema/**'
      - 'internal/manifest/**'
      - 'internal/policy/**'
      - 'internal/plan/**'
      - 'cmd/obsync/**'
      - 'plugin/src/types.ts'
      - 'plugin/src/policy.ts'
      - 'plugin/src/preview.ts'
      - 'plugin/src/store.ts'
      - 'plugin/src/sync.ts'
      - 'plugin/src/*.test.ts'
  pull_request:
    paths:
      # worker
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'deploy/rules.json'
      - 'scripts/garage-dev.sh'
      - '.github/workflows/worker.yml'
      # contract (identical in plugin.yml)
      - 'schema/**'
      - 'internal/manifest/**'
      - 'internal/policy/**'
      - 'internal/plan/**'
      - 'cmd/obsync/**'
      - 'plugin/src/types.ts'
      - 'plugin/src/policy.ts'
      - 'plugin/src/preview.ts'
      - 'plugin/src/store.ts'
      - 'plugin/src/sync.ts'
      - 'plugin/src/*.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Vet, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race -count=1 ./...

      # The test above already fails on a stale fixture. Regenerating and
      # diffing shows exactly which contract bytes the change moved, so a
      # reviewer can see what the plugin will now receive.
      - name: Contract fixtures are generated from the Go types
        run: |
          go test ./internal/manifest -run TestContractFixtures -count=1 -update
          git diff --exit-code -- schema/

      - name: Build
        run: |
          go build -trimpath -o bin/obsync-worker ./cmd/obsync-worker
          go build -trimpath -o bin/obsync ./cmd/obsync

      - name: Cross-compile for developer machines
        run: |
          GOOS=windows GOARCH=amd64 go build ./cmd/...
          GOOS=darwin GOARCH=arm64 go build ./cmd/...

      - name: Smoke test the binaries
        run: |
          ./bin/obsync-worker help
          mkdir -p "$RUNNER_TEMP/store"
          ./bin/obsync -fs-store "$RUNNER_TEMP/store" ls

  garage:
    name: S3 integration against Garage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The same script developers run; it prints GARAGE_* for the tests.
      - name: Start a single-node Garage
        run: scripts/garage-dev.sh up --plain >> "$GITHUB_ENV"

      - name: S3 integration tests
        env:
          OBSYNC_REQUIRE_S3: "1"
        run: go test -count=1 -v -run 'S3' ./internal/store ./internal/run

      # obsync serve in front of Garage is the credential-free path for the
      # plugin. Check it starts against S3 and answers like the plugin expects.
      - name: Serve Garage to a plugin-shaped client
        run: |
          go build -o bin/obsync ./cmd/obsync
          ./bin/obsync ls
          ./bin/obsync serve -addr 127.0.0.1:8765 &
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8765/obsync/manifests/0/latest)
          if [ "$code" != 404 ]; then
            echo "::error::serve over S3 answered $code for a missing manifest, want 404"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/locks/worker.json)
          if [ "$code" != 404 ]; then
            echo "::error::serve exposed locks/ (status $code)"
            exit 1
          fi

      - name: Garage logs
        if: failure()
        run: docker logs --tail 200 obsync-garage
